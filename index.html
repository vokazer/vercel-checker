<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vercel Bulk Checker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; padding: 32px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; color: #fff; }
  p.sub { color: #666; font-size: 13px; margin-bottom: 24px; }
  .card { background: #141414; border: 1px solid #222; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #666; display: block; margin-bottom: 8px; }
  textarea { width: 100%; background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 8px; color: #e0e0e0; font-size: 13px; padding: 12px; resize: vertical; min-height: 140px; font-family: 'SF Mono', monospace; outline: none; }
  textarea:focus { border-color: #444; }
  input[type=text] { width: 100%; background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 8px; color: #e0e0e0; font-size: 13px; padding: 10px 12px; outline: none; font-family: inherit; }
  input:focus { border-color: #444; }
  button { background: #5c6bc0; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s; }
  button:hover { background: #7986cb; }
  button:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }
  #exportBtn { background: #2a4a2a; color: #6fcf6f; }
  #exportBtn:hover { background: #3a5a3a; }
  .stats { display: flex; gap: 16px; margin-bottom: 16px; }
  .stat { background: #141414; border: 1px solid #222; border-radius: 8px; padding: 12px 18px; flex: 1; text-align: center; }
  .stat .num { font-size: 24px; font-weight: 700; }
  .stat .lbl { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
  .green { color: #6fcf6f; }
  .red { color: #eb5757; }
  .grey { color: #555; }
  #progress { height: 4px; background: #1a1a1a; border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
  #progressBar { height: 100%; background: #5c6bc0; width: 0%; transition: width .3s; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 12px; color: #555; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid #1e1e1e; }
  td { padding: 9px 12px; border-bottom: 1px solid #1a1a1a; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.yes { background: #1a3a1a; color: #6fcf6f; }
  .badge.no { background: #2a1a1a; color: #eb5757; }
  .badge.pending { background: #1a1a2a; color: #7986cb; }
  .badge.error { background: #2a2a1a; color: #f2c94c; }
  .domain-cell { font-family: 'SF Mono', monospace; }
  .server-cell { color: #888; font-size: 12px; }
  #resultsSection { display: none; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
</style>
</head>
<body>

<h1>⚡ Vercel Bulk Checker</h1>
<p class="sub">Paste domains, hit Run — live header check via n8n webhook</p>

<div class="card">
  <label>N8N Webhook URL</label>
  <input type="text" id="webhookUrl" value="https://n8n.storyblok.com/webhook/vercel-check" />
</div>

<div class="card">
  <label>Domains (one per line)</label>
  <textarea id="domains" placeholder="vercel.com&#10;scheucherparkett.at&#10;netzsch.com&#10;your-account.com"></textarea>
</div>

<div style="display:flex; gap:12px; margin-bottom:24px;">
  <button id="runBtn" onclick="runCheck()">▶ Run Check</button>
  <button id="stopBtn" onclick="stopCheck()" disabled>■ Stop</button>
  <button id="exportBtn" onclick="exportCSV()" style="display:none">↓ Export CSV</button>
</div>

<div id="resultsSection">
  <div class="stats">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
    <div class="stat"><div class="num green" id="statVercel">0</div><div class="lbl">Vercel ✓</div></div>
    <div class="stat"><div class="num red" id="statNo">0</div><div class="lbl">Not Vercel</div></div>
    <div class="stat"><div class="num grey" id="statPending">0</div><div class="lbl">Remaining</div></div>
  </div>

  <div id="progress"><div id="progressBar"></div></div>

  <div class="card" style="padding:0; overflow:hidden;">
    <div class="top-row" style="padding: 14px 16px 0;">
      <label style="margin:0;">Results</label>
    </div>
    <table id="resultsTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Domain</th>
          <th>Vercel?</th>
          <th>Server</th>
          <th>Vercel ID</th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>
</div>

<script>
let results = [];
let stopFlag = false;

async function runCheck() {
  const webhookUrl = document.getElementById('webhookUrl').value.trim();
  const raw = document.getElementById('domains').value.trim();
  if (!raw || !webhookUrl) return alert('Please enter webhook URL and domains!');

  const domains = raw.split('\n').map(d => d.trim()).filter(Boolean);
  if (!domains.length) return;

  results = [];
  stopFlag = false;
  document.getElementById('resultsBody').innerHTML = '';
  document.getElementById('resultsSection').style.display = 'block';
  document.getElementById('runBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('exportBtn').style.display = 'none';

  updateStats(0, 0, 0, domains.length);

  domains.forEach((d, i) => {
    results.push({ domain: d, is_vercel: null, server: '', vercel_id: '' });
    addRow(i, d, 'pending', '', '');
  });

  let vercelCount = 0;
  let noCount = 0;

  for (let i = 0; i < domains.length; i++) {
    if (stopFlag) break;

    const domain = domains[i];
    updateRow(i, domain, 'pending', '', '');

    try {
      const res = await fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ domain })
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      results[i] = {
        domain,
        is_vercel: data.is_vercel,
        server: data.server_header || '',
        vercel_id: data.vercel_id || ''
      };

      if (data.is_vercel) vercelCount++;
      else noCount++;

      updateRow(i, domain, data.is_vercel ? 'yes' : 'no', data.server_header || '—', data.vercel_id || '—');

    } catch (e) {
      results[i] = { domain, is_vercel: null, server: 'ERROR', vercel_id: '' };
      updateRow(i, domain, 'error', 'Error', e.message);
      noCount++;
    }

    const done = i + 1;
    const remaining = domains.length - done;
    updateStats(done, vercelCount, noCount, remaining);
    document.getElementById('progressBar').style.width = (done / domains.length * 100) + '%';

    if (i < domains.length - 1) await sleep(300);
  }

  document.getElementById('runBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  document.getElementById('exportBtn').style.display = 'inline-block';
}

function stopCheck() {
  stopFlag = true;
  document.getElementById('stopBtn').disabled = true;
  document.getElementById('runBtn').disabled = false;
}

function addRow(i, domain, status, server, vercelId) {
  const tbody = document.getElementById('resultsBody');
  const tr = document.createElement('tr');
  tr.id = `row-${i}`;
  tr.innerHTML = rowHTML(i, domain, status, server, vercelId);
  tbody.appendChild(tr);
}

function updateRow(i, domain, status, server, vercelId) {
  const tr = document.getElementById(`row-${i}`);
  if (tr) tr.innerHTML = rowHTML(i, domain, status, server, vercelId);
}

function rowHTML(i, domain, status, server, vercelId) {
  const badges = {
    yes: '<span class="badge yes">✓ Vercel</span>',
    no: '<span class="badge no">✗ No</span>',
    pending: '<span class="badge pending">…</span>',
    error: '<span class="badge error">⚠ Error</span>'
  };
  return `
    <td style="color:#444">${i+1}</td>
    <td class="domain-cell">${domain}</td>
    <td>${badges[status] || badges.pending}</td>
    <td class="server-cell">${server}</td>
    <td class="server-cell" style="font-family:monospace;font-size:11px">${vercelId !== '—' && vercelId ? vercelId.substring(0,30)+'…' : vercelId}</td>
  `;
}

function updateStats(total, vercel, no, pending) {
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statVercel').textContent = vercel;
  document.getElementById('statNo').textContent = no;
  document.getElementById('statPending').textContent = pending;
}

function exportCSV() {
  const rows = [['Domain', 'Is Vercel', 'Server', 'Vercel ID']];
  results.forEach(r => rows.push([r.domain, r.is_vercel, r.server, r.vercel_id]));
  const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vercel_check_results.csv';
  a.click();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
